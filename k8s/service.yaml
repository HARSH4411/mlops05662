# LoadBalancer: on Docker Desktop this is exposed at http://localhost:8080
# (on Minikube run `minikube tunnel`; on GKE/EKS/AKS a cloud LB IP is assigned)
apiVersion: v1
kind: Service
metadata:
  name: heart-api
  namespace: heart
  labels: {app: heart-api}
spec:
  type: LoadBalancer
  selector: {app: heart-api}
  ports:
    - name: http
      port: 8080
      targetPort: 8000
